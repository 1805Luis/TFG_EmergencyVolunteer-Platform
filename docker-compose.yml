services:
  nginx-balanceador:
    image: nginx:latest
    container_name: nginx-balanceador
    ports:
      - "8080:80" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - apigateway1
      - apigateway2
      - apigateway3
    restart: unless-stopped

  apigateway1:
      image: apigateway
      container_name: apigateway1
      build:
        context: ./Api-Gestion/ApiGateway
        dockerfile: Dockerfile
      environment:
        - GATEWAY_ID=apigateway1
      restart: unless-stopped

  apigateway2:
    image: apigateway
    container_name: apigateway2
    build:
      context: ./Api-Gestion/ApiGateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
        - GATEWAY_ID=apigateway2

  apigateway3:
    image: apigateway
    container_name: apigateway3
    build:
      context: ./Api-Gestion/ApiGateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - GATEWAY_ID=apigateway3

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: "unless-stopped"

  authservice:
    image: authservice
    container_name: auth
    build:
      context: ./Api-Gestion/AuthService
      dockerfile: Dockerfile
    depends_on:
      - rabbitmq
      - userservice
      - auth-db
      - apigateway1
      - apigateway2
    restart: "unless-stopped"

  auth-db:
    image: mcr.microsoft.com/mssql/server
    container_name: auth-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "%5Y8o5!*m80Un"
      MSSQL_PID: Express
    ports:
      - "14333:1433"
    restart: "unless-stopped"

  userservice:
    image: userservice
    container_name: user
    build:
      context: ./Api-Gestion/UserService
      dockerfile: Dockerfile
    depends_on:
      - rabbitmq
      - user-db
      - apigateway1
      - apigateway2
    restart: "unless-stopped"

  user-db:
    image: mcr.microsoft.com/mssql/server
    container_name: user-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "7nqfX4G99p_y"
      MSSQL_PID: Express
    restart: "unless-stopped"

  bitacoraservice1:
    image: bitacoraservice
    container_name: bitacora1
    build:
      context: ./Api-Gestion/BitacoraService
      dockerfile: Dockerfile
