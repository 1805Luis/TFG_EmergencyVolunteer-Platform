# Bloque de eventos (requerido por NGINX, aunque en la mayoría de los casos se deja vacío)
events {
    # Aquí podrías definir el número de conexiones máximas por worker, por ejemplo:
    # worker_connections 1024;
}

http {
    # Definición del grupo de API Gateways que recibirán el tráfico
    upstream apigateways {
        # Estrategías de balanceo de carga :

        # 1. Round Robin (por defecto)
        # Reparte las peticiones de forma secuencial y cíclica entre los servidores

        # 2. Least Connections
        # Envía la petición al servidor que tenga menos conexiones activas, ideal para cargas irregulares
        # least_conn;

        # 3. IP Hash 
        # Asocia siempre la misma IP cliente al mismo servidor sticky sessions
        # ip_hash;

        # 4. Peso (weight)
        # Permite asignar más tráfico a servidores con mayor peso
        # ej: server apigateway1:8080 weight=3;

        # Lista de servidores API Gateway
        server apigateway1:8080 max_fails=1 fail_timeout=5s;
        server apigateway2:8080 max_fails=1 fail_timeout=5s;
        server apigateway3:8080 backup; # Se usa solo si los anteriores fallan
    }

    # Configuración del servidor NGINX que escucha en el puerto 80
    server {
        listen 80;

        location / {
            proxy_pass http://apigateways;     

            proxy_connect_timeout 2s;    # Tiempo máximo para que se logre conectarse al backend antes de fallar y probar otro
            proxy_read_timeout 20s;      # Tiempo máximo esperando la respuesta del backend cuando ya se ha conectado
            proxy_send_timeout 20s;      # Tiempo máximo esperando que el backend acepte datos.

            #Se le dice cuando se debe dejar de intentar con el servidor que falló y pasar al siguiente del grupo
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504; 

            # proxy_set_header Host $host;                                 # Reenvía al backend el host original solicitado por el cliente 
            # proxy_set_header X-Real-IP $remote_addr;                     # IP real del cliente (no la del balanceador)
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Cadena de IPs desde el cliente hasta el backend
            # proxy_set_header X-Forwarded-Proto $scheme;                  # Protocolo usado por el cliente (http o https)
        }
    }
}
